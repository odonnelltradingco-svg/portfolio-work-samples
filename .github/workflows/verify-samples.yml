name: Verify work samples

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            analysis: false
          - python: '3.12'
            analysis: true
    steps:
      - name: Check out the published samples
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run the 19 standard-library checks
        if: ${{ !matrix.analysis }}
        run: python verify_samples.py
      - name: Install the recorded analysis dependencies
        if: ${{ matrix.analysis }}
        run: python -m pip install -r fulfillment-eda/requirements.txt
      - name: Install the recorded PDF dependencies
        if: ${{ matrix.analysis }}
        run: python -m pip install -r csv-to-pdf/requirements.txt
      - name: Run all 46 Python checks
        if: ${{ matrix.analysis }}
        run: python verify_samples.py --include-eda --include-pdf
      - name: Generate the sample order report
        if: ${{ matrix.analysis }}
        working-directory: csv-to-pdf
        run: python report_orders.py --input sample-orders.csv --output rerun-report.pdf
      - name: Re-execute the complete notebook in a fresh kernel
        if: ${{ matrix.analysis }}
        working-directory: fulfillment-eda
        env:
          MPLBACKEND: Agg
        run: python -m nbconvert --to notebook --execute fulfillment-eda.ipynb --output fulfillment-eda-rerun.ipynb --ExecutePreprocessor.timeout=180
      - name: Confirm the supplied files remain unchanged
        run: git diff --exit-code

  web-interfaces:
    name: React interfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-interfaces
    steps:
      - name: Check out the published samples
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up the recorded package manager
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '11.19.0'
          run_install: false
      - name: Install exact dependency versions
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run 28 interface-logic tests
        run: pnpm test
      - name: Check TypeScript
        run: pnpm typecheck
      - name: Check English and French labels and price presentation
        run: pnpm check:languages
      - name: Build the working routes
        run: pnpm build
      - name: Confirm the supplied files remain unchanged
        run: git diff --exit-code
